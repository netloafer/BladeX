<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BladeX Dashboard</title>
<style>
/* ── 设计令牌：三级 surface / 双级 border / 三级文字色 + 语义色（各配 soft 底）── */
:root{
  --bg:#0b0e14;--surface:#121722;--surface-2:#171d2b;--surface-3:#1e2534;
  --border:#222b3d;--border-2:#2e3950;
  --text:#dde3ec;--text-2:#98a2b5;--text-dim:#657084;
  --acc:#5b9dff;--acc-soft:rgba(91,157,255,.12);
  --ok:#3ecf8e;--ok-soft:rgba(62,207,142,.12);
  --warn:#e8a33d;--warn-soft:rgba(232,163,61,.12);
  --err:#e5615c;--err-soft:rgba(229,97,92,.12);
  --manual:#b07aff;--manual-soft:rgba(176,122,255,.12);
  --r:10px;--r-sm:7px;
  --sidebar-w:220px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:13px/1.55 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--text-2)}
.dim2{color:var(--text-dim)}
a.link{color:var(--acc);cursor:pointer;text-decoration:none}
a.link:hover{text-decoration:underline}

/* ── 布局骨架：固定侧栏 + 内容区 ── */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);flex:0 0 auto;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:baseline;gap:8px;padding:18px 18px 14px}
.brand b{font-size:16px;letter-spacing:.02em}
.brand .ver{font-size:11px;color:var(--text-dim)}
#nav{flex:1;padding:4px 10px;display:flex;flex-direction:column;gap:2px}
#nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  color:var(--text-2);font-size:13px;text-decoration:none;cursor:pointer}
#nav a svg{width:15px;height:15px;flex:0 0 auto;opacity:.75}
#nav a:hover{background:var(--surface-2);color:var(--text)}
#nav a.on{background:var(--acc-soft);color:var(--acc)}
#nav a.on svg{opacity:1}
.side-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;
  align-items:center;gap:8px;font-size:12px}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);flex:0 0 auto}
.conn-dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.conn-dot.err{background:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
#conn-label{flex:1;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#shell{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;
  border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:5}
#topbar h2{margin:0;font-size:15px;font-weight:600}
#page-sub{color:var(--text-dim);font-size:12px}
main{padding:22px 26px 40px;max-width:1320px;width:100%;margin:0 auto}

/* ── 卡片 / stat / 区块 ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 18px;margin-bottom:16px}
.card>h3{margin:0 0 12px;font-size:11px;font-weight:600;color:var(--text-2);
  text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid .card{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.07em;margin-top:4px}
.stat .s{font-size:11px;color:var(--text-dim);margin-top:2px}
.stat.warn .v{color:var(--warn)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:13px}
.kv .k{color:var(--text-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.row .grow{flex:1}
.hbar{display:flex;align-items:center;gap:10px;padding:3px 0}
.hbar .lbl{width:130px;flex:0 0 auto;color:var(--text-2);font-size:12px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.hbar .track{flex:1;height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.hbar .fill{height:100%;background:var(--acc);border-radius:3px}
.hbar .cnt{width:64px;flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}

/* ── 表格 ── */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--text-2);text-align:left;font-weight:500;font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;padding:7px 10px;
  border-bottom:1px solid var(--border-2);white-space:nowrap;
  position:sticky;top:0;background:var(--surface);z-index:1}
th.r,td.r{text-align:right}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr{cursor:default}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:none}

/* ── badge / tag ── */
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;line-height:1.5;
  background:var(--surface-3);color:var(--text-2);margin-right:4px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.err{background:var(--err-soft);color:var(--err)}
.tag.acc{background:var(--acc-soft);color:var(--acc)}
.tag.manual{background:var(--manual-soft);color:var(--manual)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}

/* ── 按钮 / 表单控件 ── */
.btn{background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);
  padding:6px 13px;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;line-height:1.4;
  transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--acc)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--acc);border-color:var(--acc);color:#0b0e14;font-weight:600}
.btn-primary:hover{filter:brightness(1.1)}
.btn-danger{color:var(--err)}
.btn-danger:hover{border-color:var(--err);background:var(--err-soft)}
.btn-ghost{background:none;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{color:var(--text);border-color:var(--border-2)}
.btn-sm{padding:3px 9px;font-size:11.5px}
input.input,select.input,textarea.input{background:var(--surface);border:1px solid var(--border-2);
  color:var(--text);padding:7px 10px;border-radius:var(--r-sm);font-size:13px;font-family:inherit}
input.input:focus,select.input:focus,textarea.input:focus{outline:none;border-color:var(--acc)}
input.q{width:300px}
label.chk{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:12.5px;cursor:pointer}

/* ── pre / 代码块 ── */
pre{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:12px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px;
  white-space:pre-wrap;word-break:break-word;margin:8px 0}
details summary{cursor:pointer;color:var(--text-2);font-size:12px;padding:4px 0}

/* ── 抽屉（详情统一容器）── */
#overlay{position:fixed;inset:0;background:rgba(4,6,10,.55);opacity:0;pointer-events:none;
  transition:opacity .15s;z-index:20}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,94vw);background:var(--surface);
  border-left:1px solid var(--border-2);transform:translateX(102%);transition:transform .18s ease;
  z-index:21;display:flex;flex-direction:column;box-shadow:-18px 0 40px rgba(0,0,0,.35)}
body.drawer-open #overlay{opacity:1;pointer-events:auto}
body.drawer-open #drawer{transform:none}
.drawer-head{display:flex;align-items:center;gap:10px;padding:15px 20px;
  border-bottom:1px solid var(--border)}
.drawer-head h3{margin:0;font-size:14px;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
.drawer-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;
  justify-content:flex-end;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 16px;margin:10px 0}
.fields .f .fk{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
.fields .f .fv{font-size:12.5px;word-break:break-all;margin-top:1px}
.sect{margin:16px 0 4px;font-size:11px;font-weight:600;color:var(--text-2);
  text-transform:uppercase;letter-spacing:.08em}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:6px 0 12px}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-2);
  padding:7px 12px;cursor:pointer;font-size:12.5px}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}

/* ── 弹窗 ── */
dialog{background:var(--surface);color:var(--text);border:1px solid var(--border-2);
  border-radius:12px;width:min(480px,92vw);padding:0}
dialog::backdrop{background:rgba(4,6,10,.6)}
dialog form{padding:20px 22px}
dialog h3{margin:0 0 8px;font-size:14px}
.dlg-body{color:var(--text-2);font-size:12.5px;margin:0 0 12px;line-height:1.6}
dialog label{display:block;font-size:12px;color:var(--text-2);margin:10px 0 0}
dialog input,dialog textarea,dialog select{width:100%;margin-top:4px;background:var(--bg);
  border:1px solid var(--border-2);color:var(--text);padding:7px 10px;border-radius:var(--r-sm);
  font-size:13px;font-family:inherit}
dialog textarea{min-height:88px;resize:vertical}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* ── toast ── */
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:40}
.toast{background:var(--surface-2);border:1px solid var(--border-2);border-left:3px solid var(--acc);
  border-radius:var(--r-sm);padding:10px 14px;max-width:400px;font-size:12.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .18s ease}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
#page-loading{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;
  background:var(--surface-2);border:1px solid var(--border-2);border-left:3px solid var(--acc);
  border-radius:var(--r-sm);padding:8px 14px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#page-loading[hidden]{display:none}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ── 骨架屏 / 空状态 / 横幅 ── */
.skel{border-radius:var(--r-sm);background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);
  background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{text-align:center;padding:44px 20px;color:var(--text-dim)}
.empty .t{font-size:13px;color:var(--text-2);margin-bottom:4px}
.empty .s{font-size:12px}
.banner{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);
  padding:12px 16px;margin-bottom:16px}
.banner.err{border-color:var(--err);background:var(--err-soft)}
.banner h4{margin:0 0 6px;font-size:12px;color:var(--warn);text-transform:uppercase;letter-spacing:.06em}
.banner.err h4{color:var(--err)}
.banner .item{padding:2px 0;font-size:12.5px}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--text-2)}

/* ── graph ── */
#graph-canvas{width:100%;height:580px;background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r);cursor:grab;display:block}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center}

/* ── 鉴权引导页 ── */
.gate{max-width:400px;margin:10vh auto;text-align:center}
.gate .card{padding:30px 28px}
.gate h3{font-size:15px;margin:0 0 6px;text-transform:none;letter-spacing:0;color:var(--text)}
.gate p{color:var(--text-2);font-size:12.5px;margin:0 0 16px;line-height:1.6}
.gate input{width:100%;margin-bottom:12px}

/* ── 响应式 ── */
@media (max-width:900px){
  #app{flex-direction:column}
  #sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;
    border-right:none;border-bottom:1px solid var(--border)}
  .brand{padding:12px 14px}
  #nav{flex-direction:row;overflow-x:auto;padding:6px}
  #nav a{white-space:nowrap;padding:6px 10px}
  #nav a svg{display:none}
  .side-foot{border-top:none;padding:8px 12px}
  #conn-label{display:none}
  main{padding:16px 14px 32px}
  #topbar{padding:12px 14px}
  input.q{width:100%}
  .fields{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><b>BladeX</b><span class="ver" id="ver"></span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <span class="conn-dot" id="conn-dot"></span>
      <span id="conn-label">Not connected</span>
      <span class="dim2" id="tz" title="All timestamps are shown in this time zone"></span>
      <button class="btn btn-ghost btn-sm" onclick="openKeyModal()" title="Admin key">Key</button>
    </div>
  </aside>
  <div id="shell">
    <header id="topbar"><h2 id="page-title"></h2><span id="page-sub"></span></header>
    <main id="main"></main>
  </div>
</div>
<div id="overlay" onclick="closeDrawer()"></div>
<aside id="drawer"></aside>
<div id="page-loading" role="status" aria-live="polite" hidden></div>
<div id="toasts"></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ═══════════════ 基础工具 ═══════════════ */
const $=s=>document.querySelector(s);
/* ADR-0027 §2.3：单引号必须转义 —— 大量 onclick="fn('${esc(id)}')" 用单引号包裹插值，
   而 session key 含 agent_id/session_id（来源是外部请求 header 与被动指纹），记忆内容
   本身也来自 LLM 流量。漏 ' 就是一条从"对话内容/请求头"到"操作员浏览器"的注入路径。 */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtBytes(n){
  if(n===null||n===undefined)return "-";
  let v=Number(n);const u=["B","KB","MB","GB","TB"];
  for(let i=0;i<u.length;i++){if(v<1024||i===u.length-1)return (i===0?v.toFixed(0):v.toFixed(1))+u[i];v/=1024;}
  return v.toFixed(1)+"TB";
}
function fmtNum(n){return (n===null||n===undefined)?"-":Number(n).toLocaleString("en-US");}
/* ── 时间显示：存的是 UTC，看的是本地 ──
   后端所有时间戳都是 UTC 产生的，序列化后带 `Z`（Memory Hub turn.ts）或
   `+00:00`（Fact/Matter/画像 model_dump）。这里统一转成**浏览器所在时区**再显示。
   🔴 naive 串（无 Z、无 ±HH:MM）也必须按 UTC 解释：ES2015+ 规定 `new Date()` 对
   不带偏移的 date-time 按**本地时区**解析，不补 Z 就会整体偏移（东八区差 8 小时），
   而且偏得很像"对的时间"，最难发现。 */
function parseTs(s){
  if(!s)return null;
  let t=String(s).trim();
  if(!/([Zz]|[+-]\d{2}:?\d{2})$/.test(t))t+="Z";
  const d=new Date(t);
  return isNaN(d.getTime())?null:d;
}
/* mode="min" → 到分钟（表格列用），默认到秒。固定宽度，便于对齐。 */
function fmtTs(s,mode){
  const d=parseTs(s);if(!d)return "-";
  const p=n=>String(n).padStart(2,"0");
  const day=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  const hm=`${p(d.getHours())}:${p(d.getMinutes())}`;
  return mode==="min"?`${day} ${hm}`:`${day} ${hm}:${p(d.getSeconds())}`;
}
/* 表格单元格：显示本地时间，悬停可看服务端原值（排查跨时区问题时要的就是原值）。 */
function tsCell(s,mode){
  if(!s)return '<span class="dim2">-</span>';
  return `<span title="${esc(s)}">${esc(fmtTs(s,mode))}</span>`;
}
/* 相对时间：一眼看出"多久以前"，绝对时间仍在 title 里 */
function fmtAgo(s){
  const d=parseTs(s);if(!d)return "";
  const sec=Math.floor((Date.now()-d.getTime())/1000);
  if(sec<0)return "in the future";
  if(sec<60)return `${sec}s ago`;
  if(sec<3600)return `${Math.floor(sec/60)}m ago`;
  if(sec<86400)return `${Math.floor(sec/3600)}h ago`;
  return `${Math.floor(sec/86400)}d ago`;
}
/* 当前时区标签（侧栏常驻，让"这是本地时间"这件事不用猜） */
function tzLabel(){
  const off=-new Date().getTimezoneOffset();
  const sign=off<0?"-":"+",a=Math.abs(off);
  const hhmm=`${String(Math.floor(a/60)).padStart(2,"0")}:${String(a%60).padStart(2,"0")}`;
  let zone="";
  try{zone=Intl.DateTimeFormat().resolvedOptions().timeZone||"";}catch(_){zone="";}
  return {short:`UTC${sign}${hhmm}`,zone};
}
function skel(n,h){let out="";for(let i=0;i<(n||3);i++)out+=`<div class="skel" style="height:${h||16}px;margin:10px 0"></div>`;return out;}
function emptyState(t,s){return `<div class="empty"><div class="t">${esc(t)}</div><div class="s">${esc(s||"")}</div></div>`;}
function errorCard(msg,retry){return `<div class="card"><div class="empty"><div class="t">Request failed</div>
  <div class="s">${esc(msg)}</div>
  ${retry?`<div style="margin-top:12px"><button class="btn" onclick="${retry}">Retry</button></div>`:""}</div></div>`;}

/* ═══════════════ 鉴权 + API 封装 ═══════════════ */
function key(){return sessionStorage.getItem("bladex_key")||"";}
function setKey(v){sessionStorage.setItem("bladex_key",v.trim());}
function setConn(state,label){
  const d=$("#conn-dot"),l=$("#conn-label");
  d.className="conn-dot"+(state==="ok"?" ok":state==="err"?" err":"");
  l.textContent=label||(state==="ok"?"Connected":state==="err"?"Disconnected":"Not connected");
}
async function api(method,path,body){
  const h={"Content-Type":"application/json"};
  if(key()) h["Authorization"]="Bearer "+key();
  let r;
  try{r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined});}
  catch(e){setConn("err");const err=new Error("Cannot reach proxy: "+e.message);err.net=true;throw err;}
  if(r.status===401){setConn("err","Auth required");
    const err=new Error("Unauthorized: an admin key is required (BLADEX_ADMIN_KEYS, or BLADEX_CLIENT_KEYS if unset)");
    err.auth=true;throw err;}
  const data=await r.json().catch(()=>({}));
  /* 🔴 2026-08-26：错误文本要从**本仓真实的响应形状**里取。
     admin 端点走 `_admin_response`，产出 `{"status": "...", "detail": "...", ...}`
     —— **没有 `error` 字段**。只认 `data.error.message` 的后果是所有 admin 侧
     4xx 都退化成一句 "HTTP 400"：调用方拿不到任何语义，用户看到的是一个三秒
     就淡出的 "HTTP 400" 红条，跟"点了没反应"没有区别。
     实测代价：合并的二次确认（`status=confirm_required`）**从来没跑通过**
     ——前端判 `/confirm/i.test(e.message)`，而 message 恒为 "HTTP 400"。
     顺序：detail（人话）> status（机器码，判据用）> HTTP 码（兜底）。 */
  if(!r.ok&&r.status!==202){
    const err=new Error(errText(data,r.status));
    err.status=data.status||"";err.httpStatus=r.status;err.data=data;throw err;
  }
  setConn("ok");data.__status=r.status;return data;
}
/* 批 DS1：错误文本单一实现点。400 有两种形状，都要读成一句人话：
   端点自己报的 `{"error":{"message":…}}`，与严格参数机制（`_strict_query` /
   `_strict_body`）报的 `{"detail":"unknown body key(s): …"}`。FastAPI 自己的 422
   `detail` 是列表，逐项拼成 `字段: 原因`，不显示 "[object Object]"。 */
function errText(data,httpStatus){
  data=data||{};
  if(Array.isArray(data.detail)&&data.detail.length)
    return data.detail.map(x=>x&&x.msg?`${(x.loc||[]).slice(1).join(".")||"body"}: ${x.msg}`:String(x)).join("; ");
  const msg=(data.error&&typeof data.error==="object"&&data.error.message)
    ||(typeof data.error==="string"&&data.error)||data.detail||data.status;
  return msg?String(msg):"HTTP "+httpStatus;
}
/* 批 DS1（MQ-W25）：写操作回 202 = Hub 已记账、Index 稍后生效，**不是失败**。 */
const MSG_DEFERRED="Recorded; takes effect shortly";
/* 批 DS1（DS-04）：user-edit 带 expected_rev，账本在这期间被写过 ⇒ 409，服务端什么都没写。 */
const MSG_REV_CONFLICT="The ledger was updated meanwhile; refresh before editing";
function writeDone(r,okMsg){
  if(r&&r.__status===202){toastMsg(MSG_DEFERRED,"warn");return "deferred";}
  toastMsg(okMsg||"Done");return "ok";
}
/* 批 DS1（MQ-I42）：慢请求的加载状态单一实现点。发出即把按钮置为不可点并换成进行中文案，
   结束（成功或失败）才恢复；已在进行中的按钮再点直接忽略——不会发第二个请求。 */
async function busy(btn,label,fn){
  if(btn&&btn.disabled)return undefined;
  const old=btn?btn.textContent:"";
  if(btn){btn.disabled=true;btn.textContent=label||"Working…";}
  try{return await fn();}
  finally{if(btn){btn.disabled=false;btn.textContent=old;}}
}
/* 批 DS2（MQ-I42 尾巴）：页面级加载提示的单一实现点。给拿不到按钮的调用方用：
   认领 / 改名的行内调用形状被 test_admin_agents_drift_ui 钉死，按钮传不进函数，用不了 busy()。
   结束（成功或失败）都熄灭；重叠时显示最后点亮的那条，全部结束才熄灭。 */
const _pageLoads=[];
function _renderPageLoading(){
  const e=$("#page-loading"),cur=_pageLoads[_pageLoads.length-1];
  e.hidden=!cur;e.textContent=cur?cur.label:"";
}
async function withPageLoading(label,fn){
  const tok={label};_pageLoads.push(tok);_renderPageLoading();
  try{return await fn();}
  finally{_pageLoads.splice(_pageLoads.indexOf(tok),1);_renderPageLoading();}
}

/* Promise 化弹窗：fields 为空即确认框；resolve 表单值对象或 null（取消） */
function ask(o){return new Promise(res=>{
  const dlg=$("#dlg");
  dlg.innerHTML=`<form method="dialog">
    <h3>${esc(o.title)}</h3>
    ${o.body?`<p class="dlg-body">${o.body}</p>`:""}
    ${(o.fields||[]).map(f=>{
      /* select：合并目标必须**选**不能**打**——打错一个字不是合并，是悄悄新建
         一个 agent，也就是身份分裂（2026-08-26 Jason 指出）。 */
      const inner=f.type==="textarea"
        ?`<textarea name="${f.name}" placeholder="${esc(f.ph||"")}">${esc(f.value||"")}</textarea>`
        :f.type==="select"
        ?`<select name="${f.name}">${(f.options||[]).map(o=>
            `<option value="${esc(o.value)}"${o.value===f.value?" selected":""}>${esc(o.label||o.value)}</option>`
          ).join("")}</select>`
        :`<input name="${f.name}" value="${esc(f.value||"")}" placeholder="${esc(f.ph||"")}"${
            f.enableWhen&&!(f.enableWhen.equals===((o.fields.find(x=>x.name===f.enableWhen.field)||{}).value))?" disabled":""}>`;
      return `<label>${esc(f.label)}${inner}</label>`;}).join("")}
    <div class="dlg-actions">
      <button type="button" class="btn" onclick="this.closest('dialog').close('cancel')">Cancel</button>
      <button class="btn ${o.danger?"btn-danger":"btn-primary"}" value="ok">${esc(o.ok||"OK")}</button>
    </div></form>`;
  /* 声明式联动：`enableWhen:{field,equals}` —— 控制字段取到那个值时本字段才可用。
     🔴 不注入裸 JS 字符串（那会让 ask() 变成一个执行任意代码的洞），
     也不写死"target/to"这对具体名字（下一个用到联动的对话框就会各写一份）。
     顺带一个好处：**disabled 的输入不会进 FormData** —— 选了合并目标之后
     `v.to` 直接不存在，调用方拿不到一个"用户其实没打算用"的值。 */
  (o.fields||[]).filter(f=>f.enableWhen).forEach(f=>{
    const ctl=dlg.querySelector(`[name="${f.enableWhen.field}"]`);
    const el=dlg.querySelector(`[name="${f.name}"]`);
    if(!ctl||!el)return;
    const sync=()=>{const on=ctl.value===f.enableWhen.equals;
      el.disabled=!on; el.closest("label").style.opacity=on?"":"0.45";};
    ctl.addEventListener("change",sync); sync();
  });
  dlg.onclose=()=>{const v=dlg.returnValue;dlg.returnValue="";
    if(v==="ok"){const fd=new FormData(dlg.querySelector("form"));res(Object.fromEntries(fd.entries()));}
    else res(null);};
  dlg.showModal();
});}

function degradationBanner(s){
  const d=s.degradation||{},w=[];
  if(d.inject_timeout_1h)w.push(`${d.inject_timeout_1h} turns degraded on inject timeout in the last hour (hard rules only) - raise BLADEX_HOTPATH_BUDGET_MS or narrow retrieval`);
  if(d.enqueue_skipped_1h)w.push(`${d.enqueue_skipped_1h} turns spilled to disk in the last hour (Redis unreachable) - no memory from them until replay`);
  if(d.index_unavailable_1h)w.push(`${d.index_unavailable_1h} lookups hit an unavailable Memory Index layer in the last hour - check the embedding backend`);
  if(d.inject_failed_1h)w.push(`${d.inject_failed_1h} injections failed in the last hour - see inject_source_failed in the log`);
  const lag=(s.index||{}).lag_turns;
  if(typeof lag==="number"&&lag>500)w.push(`consolidator is behind by ${lag} turns - new memory stays unrecallable`);
  if(!w.length)return "";
  return `<div class="banner"><h4>Degraded</h4>
    ${w.map(x=>`<div class="item">${esc(x)}</div>`).join("")}</div>`;
}

const PAGE=50;
let fOffset=0;

function pagerHtml(total,offset,fn,size){
  const n=size||PAGE,from=total?offset+1:0,to=Math.min(offset+n,total);
  return `<span>${from}-${to} of ${fmtNum(total)}</span>
    <button class="btn btn-sm" ${offset<=0?"disabled":""} onclick="${fn}(-1)">Prev</button>
    <button class="btn btn-sm" ${to>=total?"disabled":""} onclick="${fn}(1)">Next</button>`;
}
function fPage(dir){fOffset=Math.max(0,fOffset+dir*PAGE);loadFacts();}
function filterItemKind(k){if(!ITEM_KINDS.includes(k))return;$("#fitem").value=k;fOffset=0;loadFacts();}
/* 批 DS2（DS-13）：修改史读不到 ≠ 没有修改过，要分开显示（原则 13 层 4）。
   事件是按 type 区分的开放列表：不认识的 type 照常列出，不丢。 */
async function factHistory(id){
  try{return await api("GET","/admin/facts/"+encodeURIComponent(id)+"/history");}
  catch(e){return {__err:e.message};}
}
function factEventRow(e){
  const when=tsCell(e.at),who=e.origin?`<span class="tag">${esc(e.origin)}</span>`:"";
  if(e.type==="fact_correct")
    return `<div class="kv"><span>Corrected ${who}</span><span>${when}</span></div>
      <div class="dim" style="margin:0 0 8px"><div>Before: ${esc(e.previous_content??"n/a")}</div><div>After: ${esc(e.content??"n/a")}</div></div>`;
  if(e.type==="tombstone")
    return `<div class="kv"><span>Deleted ${who}</span><span>${when}</span></div>`;
  const {type,at,origin,key,...rest}=e;
  return `<div class="kv"><span>${esc(type)} ${who}</span><span>${when}</span></div>
    <pre style="margin:0 0 8px">${esc(JSON.stringify(rest))}</pre>`;
}
function factHistoryHtml(h){
  const title='<div class="sect">History</div>';
  if(!h||h.__err||!Array.isArray(h.events))
    return `${title}<div class="kv dim2">n/a${h&&h.__err?` (${esc(h.__err)})`:""}</div>`;
  if(!h.events.length)return `${title}<div class="kv dim2">Never corrected or deleted</div>`;
  return title+h.events.map(factEventRow).join("");
}
/* 更正：origin 固定 dashboard，submitter 留空（服务端判）。被拒时带着稿子重开，不丢输入。 */
async function factCorrect(id,btn){
  let f;try{f=await api("GET","/admin/facts/"+encodeURIComponent(id));}
  catch(e){toastMsg(e.message,"err");return;}
  let draft=f.content||"";
  for(;;){
    const v=await ask({title:"Correct this fact",ok:"Save",
      body:"Only the text changes; the fact keeps its id and attribution. The old text stays in the history. Line breaks become spaces.",
      fields:[{name:"content",label:"Text",type:"textarea",value:draft}]});
    if(!v)return;
    draft=String(v.content||"");
    const content=draft.replace(/\n/g," ").trim();
    if(!content){toastMsg("Text cannot be empty","err");continue;}
    if(content===f.content){toastMsg("No change");return;}
    try{
      const r=await busy(btn,"Saving…",()=>api("POST","/admin/facts/"+encodeURIComponent(id)+"/correct",
        {content,origin:"dashboard",submitter:""}));
      if(!r)return;
      writeDone(r,r.status==="unchanged"?"No change":"Fact corrected");
      /* Index 读句柄最多落后约 1 s：corrected 时直接显示新文字，不靠马上重读 */
      await factDetail(id,r.status==="corrected"?{content}:undefined);
      return;
    }catch(e){toastMsg(e.message,"err");}
  }
}

     ${tags.length?`<div class="sect">Tags</div>${tags.map(t=>`<span class="tag ${t==="origin:manual"?"manual":""}">${esc(t)}</span>`).join(" ")}`:""}
     ${f.entities?`<div class="sect">Entities</div><span class="dim">${esc(String(f.entities))}</span>`:""}

     <button class="btn" onclick="promoteScope('fact','${esc(f.id)}')">Promote scope</button>
     <button class="btn btn-danger" onclick="forgetFact('${esc(f.id)}')">Delete</button>`));
}
async function forgetFact(id){
  const v=await ask({title:"Delete fact",danger:true,ok:"Delete",
    body:`Tombstone semantics: a tombstone is appended to the Memory Hub, the Memory Index entry is cascaded out, and rebuilds never revive it.<br><span class="mono">${esc(id)}</span><br><br>This cannot be undone.`});
  if(!v)return;
  try{const r=await api("DELETE","/admin/facts/"+encodeURIComponent(id));
    writeDone(r,"Deleted");
    closeDrawer();loadFacts();
  }catch(e){toastMsg(e.message,"err");}
}
async function rememberFact(){
  const v=await ask({title:"Remember a fact",ok:"Remember",
    body:"Stored as a manual fact (trust=1.0, origin:manual) and journaled as FACT_IMPORT, so it survives full rebuilds. Same text is idempotent.",
    fields:[{name:"content",label:"Content",type:"textarea",ph:"What should BladeX remember?"},
            {name:"scope",label:"Scope (optional)",ph:"personal / team:<id> / org:<id>"}]});

  try{const r=await api("POST","/admin/facts",{content:v.content.trim(),scope:(v.scope||"").trim()});
    writeDone(r,"Remembered");

async function promoteScope(type,id){

/* topic_keys（2026-08-14 主题键机制）：dict key→计票，按票数降序取前 n 个渲染 chip */

async function matterDetail(id){

async function matterOp(op,id){
  const run=async(path,body)=>{try{
      const r=await api("POST",`/admin/matters/${encodeURIComponent(id)}/${path}`,body);
      writeDone(r,"Done");
      matterDetail(id);if(tab==="matters")loadMatters();
    }catch(e){toastMsg(e.message,"err");}};
  if(op==="close"){
    const v=await ask({title:"Close Matter",danger:true,ok:"Close",
      body:"Recorded as an admin event and replayed on rebuild. Closed Matters stop attracting new attributions."});
    if(v)run("close",{});return;}
  if(op==="rename"){
    const v=await ask({title:"Rename Matter",fields:[{name:"title",label:"New title"}]});
    if(v&&v.title)run("rename",{title:v.title});return;}
  if(op==="assign"){
    const v=await ask({title:"Manual assignment",body:"Manual overrides auto (ADR-0012).",
      fields:[{name:"target_key",label:"Target (fact_id or session prefix)"},
              {name:"target_type",label:"Type (fact / session)",value:"fact"}]});
    if(v&&v.target_key)run("assign",{target_key:v.target_key,target_type:v.target_type||"fact"});return;}
  if(op==="merge"){
    const v=await ask({title:"Merge into this Matter",
      body:"The source Matter is absorbed and then closed.",
      fields:[{name:"source",label:"Source matter_id"}]});
    if(v&&v.source)run("merge",{source_matter_id:v.source});return;}
  if(op==="detach"){
    const v=await ask({title:"Detach attribution edge",
      fields:[{name:"edge_id",label:"edge_id (or leave empty and use the fields below)"},
              {name:"target_key",label:"target_key"},
              {name:"target_type",label:"Type",value:"fact"}]});
    if(v)run("detach",v.edge_id?{edge_id:v.edge_id}:{target_key:v.target_key,target_type:v.target_type||"fact"});return;}
  if(op==="split"){
    const v=await ask({title:"Split Matter",body:"Moves the listed edges to a new Matter.",
      fields:[{name:"new_title",label:"New Matter title"},
              {name:"edge_ids",label:"edge_ids (comma separated)"}]});
    if(v&&v.new_title)run("split",{new_title:v.new_title,
      edge_ids:(v.edge_ids||"").split(",").map(s=>s.trim()).filter(Boolean)});return;}
}
async function matterCreate(){
  const v=await ask({title:"New Matter",ok:"Create",body:"Created with origin=manual.",
    fields:[{name:"title",label:"Title"},{name:"summary",label:"Summary (optional)"}]});
  if(!v||!v.title)return;
  try{const r=await api("POST","/admin/matters",{title:v.title,summary:v.summary||""});
    writeDone(r,"Created");loadMatters();

/* 合并提案（matter-dedup-keywords 拍板 C）：只读检测，合并永远走 manual merge。
   批 DS1（MQ-I42）：live 上这一次要 33 s——先开抽屉显示进行中、按钮不可再点；
   在途时再点（或从 mergePair 刷新）共用同一个请求，不叠第二个全扫。 */
let mcInflight=null;
async function mergeCandidates(btn){

  catch(e){openDrawer(drawerShell("Merge candidates","",errorCard(e.message)));toastMsg(e.message,"err");return;}

       merging is always a manual admin event, replayable on rebuild (misattribution red line = 0).</p>
     ${pairs.map(p=>`<div class="card" style="margin-bottom:10px">

async function mergePair(source,target){
  const v=await ask({title:"Merge Matters",danger:true,ok:"Merge",
    body:`Absorbs <span class="mono">${esc(source)}</span> into <span class="mono">${esc(target)}</span> and closes the source. Recorded as a MATTER_MERGE admin event.`});
  if(!v)return;

      {source_matter_id:source});

/* ═══════════════ Graph（MatterGraph 力导向，vanilla canvas 零依赖）═══════════════ */
/* DS-26：首屏一次批量读（批 DS1b，MQ-I41：一次全扫按 Matter 分组，生产快照 0.46 s）。
   修前 = 1 次列表 + 每个 Matter 一次详情（329 个只画 200 个，估算 41 s）。limit 上限 500；
   超过就按 offset 再取，最多 GRAPH_MAX_PAGES 次——首屏请求 ≤ 3，再多就明说只画了多少。 */
const GRAPH_PAGE=500,GRAPH_MAX_PAGES=3,GRAPH_FACTS_TOP_K=30;
let graphInflight=null;
function graphShell(loading){
  return `<div class="row">
    <div class="legend">
      <span><span class="dot" style="background:var(--acc)"></span>Matter (auto)</span>
      <span><span class="dot" style="background:var(--manual)"></span>Matter (manual)</span>
      <span><span class="dot" style="background:#5a6274"></span>Matter (closed)</span>
      <span><span class="dot ok"></span>Fact</span>
      <span><span class="dot warn"></span>Session</span>
      <span class="dim2">Drag to pan, scroll to zoom, click a Matter for details</span>
    </div>
    <span class="grow"></span>
    <span class="dim2" id="gprog">${loading?"loading Matters and edges…":""}</span>
    <button class="btn btn-sm" id="greload" onclick="viewGraph()"${loading?" disabled":""}>${loading?"Loading…":"Reload"}</button></div>
  ${loading?loadingBlock("Loading every Matter with its edges…"):'<canvas id="graph-canvas"></canvas>'}`;
}
async function fetchGraphPages(){
  const matters=[],members={};let total=0,pages=0;
  do{
    const p=new URLSearchParams({include:"members",facts_top_k:String(GRAPH_FACTS_TOP_K),
      limit:String(GRAPH_PAGE),offset:String(matters.length)});
    const d=await api("GET","/admin/matters?"+p);pages++;
    total=d.total||0;matters.push(...(d.matters||[]));Object.assign(members,d.members||{});
    if(!(d.matters||[]).length)break;
  }while(matters.length<total&&pages<GRAPH_MAX_PAGES);
  return {matters,members,total};
}
async function viewGraph(){
  const m=$("#main");
  m.innerHTML=graphShell(true);
  if(!graphInflight)graphInflight=fetchGraphPages().finally(()=>{graphInflight=null;});
  let g;
  try{g=await graphInflight;}
  catch(e){if(tab!=="graph")return;if(e.auth)return authGate();
    m.innerHTML=errorCard(e.message,"viewGraph()");return;}
  if(tab!=="graph")return;
  m.innerHTML=graphShell(false);
  const {matters,members,total}=g;
  if(!matters.length){
    m.insertAdjacentHTML("beforeend",emptyState("Nothing to draw yet","The graph appears once Matters exist"));
    return;}
  const nodes=[],links=[],idx={};
  for(const mt of matters){
    idx["m:"+mt.matter_id]=nodes.length;
    nodes.push({id:mt.matter_id,label:mt.title||mt.matter_id,type:"matter",
      manual:mt.origin==="manual",closed:mt.status==="closed"});
  }
  for(const mt of matters){
    const d=members[mt.matter_id]||{};
    for(const e of (d.edges||[])){
      const tid=(e.target_type==="fact"?"f:":"s:")+e.target_key;
      if(!(tid in idx)){idx[tid]=nodes.length;
        const fact=(d.facts||[]).find(f=>f.id===e.target_key);
        nodes.push({id:e.target_key,type:e.target_type,
          label:fact?fact.content.slice(0,40):e.target_key.slice(0,24)});}
      links.push({a:idx["m:"+mt.matter_id],b:idx[tid],manual:e.provenance==="manual"});
    }
  }
  const gp=$("#gprog");
  if(gp)gp.textContent=`${matters.length}${matters.length<total?` of ${total}`:""} Matters, ${nodes.length} nodes, ${links.length} edges`
    +(matters.length<total?` (stopped after ${GRAPH_MAX_PAGES} pages)`:"");
  runForce(nodes,links);
}
function runForce(nodes,links){
  const cv=$("#graph-canvas");if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.clientWidth*dpr;cv.height=580*dpr;
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const W=cv.clientWidth,H=580;
  nodes.forEach((n,i)=>{const a=i/nodes.length*Math.PI*2;
    n.x=W/2+Math.cos(a)*(n.type==="matter"?120:220)+Math.random()*30;
    n.y=H/2+Math.sin(a)*(n.type==="matter"?120:220)+Math.random()*30;n.vx=0;n.vy=0;});
  let panX=0,panY=0,zoom=1,dragging=null,panning=false,px=0,py=0,alpha=1,live=true;
  function step(){
    if(!document.body.contains(cv)){live=false;return;}
    alpha=Math.max(alpha*0.985,0.02);
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y;
      let d2=dx*dx+dy*dy||1;if(d2<90000){const f=800/d2*alpha;
        const d=Math.sqrt(d2);dx/=d;dy/=d;
        a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f;}}
    for(const l of links){const a=nodes[l.a],b=nodes[l.b];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=(d-70)*0.02*alpha;
      a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;}
    for(const n of nodes){if(n===dragging)continue;
      n.vx+=(W/2-n.x)*0.0006*alpha;n.vy+=(H/2-n.y)*0.0006*alpha;
      n.x+=n.vx;n.y+=n.vy;n.vx*=0.85;n.vy*=0.85;}
    draw();requestAnimationFrame(step);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(panX,panY);ctx.scale(zoom,zoom);
    for(const l of links){const a=nodes[l.a],b=nodes[l.b];
      ctx.strokeStyle=l.manual?"rgba(176,122,255,.6)":"rgba(120,130,150,.25)";
      ctx.lineWidth=l.manual?1.6:0.8;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
    for(const n of nodes){
      const r=n.type==="matter"?9:3.5;
      ctx.fillStyle=n.type==="matter"?(n.closed?"#5a6274":(n.manual?"#b07aff":"#5b9dff"))
        :(n.type==="session"?"#e8a33d":"#3ecf8e");
      ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fill();
      if(n.type==="matter"&&zoom>0.6){ctx.fillStyle="#dde3ec";ctx.font="11px sans-serif";
        ctx.fillText(n.label.slice(0,18),n.x+11,n.y+4);}}
    ctx.restore();
  }
  function pick(mx,my){const x=(mx-panX)/zoom,y=(my-panY)/zoom;
    return nodes.find(n=>{const r=n.type==="matter"?11:6;
      return (n.x-x)**2+(n.y-y)**2<r*r;});}
  cv.onmousedown=e=>{const r=cv.getBoundingClientRect();
    const n=pick(e.clientX-r.left,e.clientY-r.top);
    if(n){dragging=n;}else{panning=true;}px=e.clientX;py=e.clientY;};
  cv.onmousemove=e=>{if(dragging){dragging.x+=(e.clientX-px)/zoom;dragging.y+=(e.clientY-py)/zoom;
      alpha=Math.max(alpha,0.3);}
    else if(panning){panX+=e.clientX-px;panY+=e.clientY-py;}
    px=e.clientX;py=e.clientY;
    const r=cv.getBoundingClientRect();
    cv.style.cursor=pick(e.clientX-r.left,e.clientY-r.top)?"pointer":"grab";};
  cv.onmouseup=e=>{if(dragging&&dragging.type==="matter"&&Math.abs(e.clientX-px)<4){matterDetail(dragging.id);}
    dragging=null;panning=false;};
  cv.onwheel=e=>{e.preventDefault();const f=e.deltaY<0?1.1:0.9;zoom=Math.min(3,Math.max(0.3,zoom*f));};
  step();
}

let sOffset=0;
// ── V-L5 附卡：账本视图 ──────────────────────────────────────────────────
// 在此之前 dashboard 完全看不到账本（只能靠 probe 脚本），而 0.1.0 gate 的
// 演示剧本之一就是「账本机制稳定运转」。账本的作者是 agent 侧的模型，

// 关 / 重开 / 取代 / 编辑 / 新建 / 导入与 CLI 走同一组端点、落同一种 Hub 事件。
// origin：生命周期端点只收 user / cli，记 `user`；新建与编辑记 `dashboard`（批 DS2，MQ-F18）。
let ledgerRows=[];
/* MQ-F16：被拒的直编。数据 = /admin/status 的 flash.user_edit_refused；null = 没有读数，不是 0。 */

function ledgerRefusal(id){return (ledgerRefusals||[]).find(r=>r.ledger_id===id)||null;}
function ledgerRefusalBanner(id){

/* DS-02：状态列 + 状态筛选（列表是整个池，客户端筛，不再发请求） */
function renderLedgerRows(){

function ledgerStatusTag(st){

function ledgerLink(lid,title){

/* DS-03：取代链 + 关闭者。admin / CLI 关本没有会话与 agent ⇒ 两个字段为空，
   显示成「by you / CLI」而不是空白——空是一种语义（ledger.py `closed_by_agent` 注释）。 */
function ledgerLifecycleHtml(d){
  const l=d.ledger||{},chain=d.superseded_chain||[],sups=d.supersedes||[];
  let out="";
  if(l.status==="closed"){
    const who=l.closed_by_agent
      ?`by <span class="tag acc">${esc(l.closed_by_agent)}</span>${l.closed_by_session?` <span class="mono dim2">${esc(l.closed_by_session)}</span>`:""}`
      :'<span class="dim2">by you / CLI (no agent session)</span>';
    out+=`<div class="sect">Closed</div><div class="kv"><span>${l.closed_at?tsCell(l.closed_at):'<span class="dim2">time not recorded</span>'} ${who}</span></div>`;
  }
  if(chain.length){
    out+=`<div class="sect">Superseded by</div>`+chain.map((c,i)=>
      `<div class="kv"><span>${"&rarr; ".repeat(i+1)}${ledgerLink(c.ledger_id,c.title)}</span>
       <span class="tag ${c.status==="active"?"ok":""}">${esc(c.status)}</span></div>`).join("");
  }
  if(sups.length){
    out+=`<div class="sect">Supersedes</div>`+sups.map(s=>
      `<div class="kv"><span>${ledgerLink(s,(ledgerRows.find(r=>r.ledger_id===s)||{}).title)}</span></div>`).join("");
  }
  return out;
}
/* draft：编辑被 409 拒时用户没保存的那一版——摆出来给他复制，不丢，也不替他重发 */

/* DS-01：动作按状态给——活着的能关 / 被取代；关了的能重开。取代过的不再给取代（要改链先重开）。 */
function ledgerFoot(l){
  const id=esc(l.ledger_id),closed=l.status==="closed";
  return `<button class="btn" data-act="edit" onclick="ledgerEdit('${id}',this)">Edit</button>
    <button class="btn" data-act="handoff" onclick="ledgerHandoff('${id}')">Handoff…</button>
    ${closed?"":`<button class="btn" data-act="close" onclick="ledgerLifecycle('close','${id}',this)">Close</button>`}
    ${l.superseded_by?"":`<button class="btn" data-act="supersede" onclick="ledgerLifecycle('supersede','${id}',this)">Supersede…</button>`}
    ${closed?`<button class="btn" data-act="reopen" onclick="ledgerLifecycle('reopen','${id}',this)">Reopen</button>`:""}`;
}
/* 账本写同时只许一个在途：两个动作交错（关的同时又点了重开）结果取决于到达顺序，用户看不出来 */
let ledgerWriting=false;
async function ledgerWrite(btn,label,path,body,okMsg){
  if(ledgerWriting){toastMsg("Another ledger change is still being saved","warn");return null;}
  ledgerWriting=true;
  try{return await busy(btn,label,async()=>{
      const r=await api("POST",path,body);writeDone(r,okMsg(r));return r;});}
  finally{ledgerWriting=false;}
}
const LEDGER_OP={
  close:{title:"Close ledger",ok:"Close",label:"Closing…",
    body:"Marks the task as done. Any agent scope that has it active is released (the next turns are not anchored to it). Goal and entries are not touched. Reversible: Reopen.",
    msg:r=>r.status==="noop"?"Already closed":"Ledger closed"},
  reopen:{title:"Reopen ledger",ok:"Reopen",label:"Reopening…",
    body:"Restores the status only and clears the superseded-by pointer. It is NOT re-activated: an agent switches to it when needed.",
    msg:r=>r.status==="noop"?"Not closed; nothing to do":"Ledger reopened (not activated)"},
  supersede:{title:"Supersede ledger",ok:"Supersede",label:"Saving…",
    body:"Closes this ledger and records which ledger carries the task on. Reversible: Reopen.",
    msg:r=>r.status==="noop"?"Already superseded by that ledger":"Ledger superseded"},
};
async function ledgerLifecycle(op,id,btn){
  const spec=LEDGER_OP[op];if(!spec)return;
  if(ledgerWriting){toastMsg("Another ledger change is still being saved","warn");return;}
  const fields=[];
  if(op==="supersede"){
    /* 目标要**选**不要打：打错一个 id 服务端会 400，但选更不会错 */
    let rows=ledgerRows;
    if(!rows.length){try{rows=(await api("GET","/admin/ledgers")).ledgers||[];}
      catch(e){toastMsg(e.message,"err");return;}}
    const opts=rows.filter(r=>r.ledger_id!==id).map(r=>({value:r.ledger_id,
      label:`${r.title||"(untitled)"} — ${r.ledger_id}${(r.status||"active")==="closed"?" (closed)":""}`}));
    if(!opts.length){toastMsg("No other ledger to supersede with","err");return;}
    fields.push({name:"target",label:"Superseded by (the ledger that carries the task on)",type:"select",
      options:opts,value:opts[0].value});
  }
  fields.push({name:"reason",label:"Reason (optional, kept in the Memory Hub event)",type:"textarea"});
  const v=await ask({title:spec.title,ok:spec.ok,body:`${esc(spec.body)}<br><span class="mono">${esc(id)}</span>`,fields});
  if(!v)return;
  const body={origin:"user",reason:(v.reason||"").trim()};
  if(op==="supersede")body.superseded_by=v.target||"";
  try{const r=await ledgerWrite(btn,spec.label,`/admin/ledgers/${encodeURIComponent(id)}/${op}`,body,spec.msg);
    if(r){await ledgerDetail(id);if(tab==="ledgers")viewLedgers();}
  }catch(e){toastMsg(e.message,"err");}
}
/* ── DS-04：用户编辑（`POST /admin/ledgers/{id}/edit`，批 DS2 · MQ-F18）──
   此前走 `/user-edit`：事件只有 `{ledger}`，与 flash daemon 采纳逐字相同，Hub 里分不清谁改的
   （原则 13 层 4）。现在 `origin=dashboard` ⇒ 事件 `origin=dashboard_edit`；`/user-edit` 留给 daemon。
   ① 必带 `expected_rev` = 打开编辑时读到的 rev：这期间 agent 写过 ⇒ 409、服务端什么都没写，
      页面不重发、不覆盖，把用户的稿子摆出来；
   ② 只发改过的部分（服务端只替换点名的段）。段内没改的条目原样带回（来源 / ref / writer 不丢），
      新增行记 source=user。段里有多行条目的不进编辑框（逐行编辑会把它拆碎）。
   Goal 由服务端经 `update_goal` 变换，页面不算 goal_source / goal_revisions。 */
function ledgerEditableSections(l){
  return (l.section_order||[]).filter(s=>s!=="goal").map((key,idx)=>({key,idx,
    multiline:(((l.sections||{})[key])||[]).some(e=>/[\r\n]/.test(String(e.text||"")))}));
}
function buildLedgerEdit(orig,v){
  /* draft 只用来在 409 时把用户的稿子摆出来；发出去的是 body */
  const draft=JSON.parse(JSON.stringify(orig)),body={},changed=[];
  if(v.title!==undefined){const t=String(v.title).trim();
    if(t!==String(orig.title||"").trim()){body.title=t;draft.title=t;changed.push("title");}}
  if(v.goal!==undefined){const g=String(v.goal).trim();
    if(g!==String(orig.goal||"").trim()){body.goal=g;draft.goal=g;changed.push("goal");}}
  for(const s of ledgerEditableSections(orig)){
    const raw=v["sec_"+s.idx];if(s.multiline||raw===undefined)continue;
    const lines=String(raw).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    const pool=((orig.sections||{})[s.key])||[],used=new Set();
    const next=lines.map(t=>{
      const i=pool.findIndex((e,j)=>!used.has(j)&&String(e.text||"").trim()===t);
      if(i>=0){used.add(i);return pool[i];}
      return {text:t,source:"user",ref:"",writer:""};});
    if(next.length!==pool.length||next.some((e,i)=>e!==pool[i])){
      const copy=JSON.parse(JSON.stringify(next));
      body.sections=body.sections||{};body.sections[s.key]=copy;
      draft.sections=draft.sections||{};draft.sections[s.key]=copy;changed.push(s.key);}
  }
  return {body,draft,changed};
}
function ledgerDraftText(l){
  const out=[`Title: ${l.title||""}`,"",`Goal: ${l.goal||""}`];
  for(const s of (l.section_order||[]).filter(s=>s!=="goal")){
    out.push("",`[${s}]`,...(((l.sections||{})[s])||[]).map(e=>"- "+e.text));}
  return out.join("\n");
}
async function ledgerEdit(id,btn){
  if(ledgerWriting){toastMsg("Another ledger change is still being saved","warn");return;}
  let d;try{d=await api("GET","/admin/ledgers/"+encodeURIComponent(id));}
  catch(e){toastMsg(e.message,"err");return;}
  const l=d.ledger||{};
  if(!Number.isInteger(l.rev)){toastMsg("This ledger has no revision number; editing is disabled","err");return;}
  const secs=ledgerEditableSections(l),locked=secs.filter(s=>s.multiline).map(s=>s.key);
  const v=await ask({title:"Edit ledger",ok:"Save",
    body:`Saving changes only what you edit here (you are at rev ${esc(l.rev)}). If an agent writes to it before you save, nothing is saved and you are told so. One entry per line; unchanged lines keep their source.`
      +(locked.length?`<br>Not editable here (they contain multi-line entries, kept as they are): ${locked.map(esc).join(", ")}`:""),
    fields:[{name:"title",label:"Title",value:l.title||""},
            {name:"goal",label:"Goal (only you can change it)",type:"textarea",value:l.goal||""},
            ...secs.filter(s=>!s.multiline).map(s=>({name:"sec_"+s.idx,label:s.key,type:"textarea",
              value:(((l.sections||{})[s.key])||[]).map(e=>e.text).join("\n")}))]});
  if(!v)return;
  const out=buildLedgerEdit(l,v);
  if(!out.changed.length){toastMsg("No changes");return;}
  try{const r=await ledgerWrite(btn,"Saving…",`/admin/ledgers/${encodeURIComponent(id)}/edit`,
        {...out.body,expected_rev:l.rev,origin:"dashboard"},
        r=>r.status==="noop"?"No changes":`Ledger saved (${out.changed.join(", ")}; rev ${r.rev})`);
    if(r){await ledgerDetail(id);if(tab==="ledgers")viewLedgers();}
  }catch(e){
    if(e.httpStatus===409){toastMsg(MSG_REV_CONFLICT,"err");await ledgerDetail(id,{draft:out.draft});}
    else toastMsg(e.message,"err");
  }
}

/* ── DS-05：交接页（批 DS2，端点来自批 CB）──
   预览与导出同一个端点，服务端已替换路径和凭证；页面不再加工 markdown。
   exposure 默认 public：包要离开本机，目的地未知按最坏算（与 CLI 和端点默认相同）。
   不提供激活（拍板 (41)-a-③）。警告句与 CLI `_handoff_export` 同一句（用例对账）。 */
const HANDOFF_DEFAULT_EXPOSURE="public";
const HANDOFF_REVIEW_WARNING="Review it before sending: the five sections are not filtered for personal information.";
const MSG_NOT_ACTIVE="It is not active yet. An agent sees it among its ledger candidates and switches to it.";
let handoffCur=null,handoffSeq=0;
function handoffShell(id,exposure,body,foot){
  const opts=["public","private","local"].map(x=>
    `<option value="${x}"${x===exposure?" selected":""}>${x}</option>`).join("");
  return drawerShell(`Handoff <span class="mono">${esc(id)}</span>`,"",
    `<label class="dim2">Where the package is going
       <select class="input" id="hexposure" onchange="ledgerHandoff('${esc(id)}',this.value)">${opts}</select></label>
     <div class="banner warn" id="hwarning" style="margin:10px 0">${esc(HANDOFF_REVIEW_WARNING)}</div>${body}`,
    foot||`<button class="btn" onclick="ledgerDetail('${esc(id)}')">Back to ledger</button>`);
}
function handoffCounts(title,obj,labels){
  return `<div class="sect">${esc(title)}</div><div class="fields">`
    +labels.map(([k,l])=>field(l,String((obj||{})[k]??"n/a"))).join("")+"</div>";
}
async function ledgerHandoff(id,exposure){
  const exp=exposure||HANDOFF_DEFAULT_EXPOSURE,seq=++handoffSeq;
  handoffCur=null;
  openDrawer(handoffShell(id,exp,loadingBlock("Building the handoff package…")));
  let d;try{[d]=await Promise.all([api("GET",`/admin/ledgers/${encodeURIComponent(id)}/handoff?`+new URLSearchParams({exposure:exp})),loadLedgerRefusals()]);}
  catch(e){
    if(seq!==handoffSeq)return;
    openDrawer(handoffShell(id,exp,errorCard(e.message,`ledgerHandoff('${esc(id)}','${exp}')`)));return;
  }
  /* 用户又换了 exposure：只显示最后一次 */
  if(seq!==handoffSeq)return;
  handoffCur={id,data:d};
  const p=d.package||{},t=p.trimmed||{};
  openDrawer(handoffShell(id,exp,
    `${ledgerRefusal(id)?`<div class="banner warn" data-refused="1" style="margin:0 0 10px">This ledger's file has an edit that was not adopted: ${esc(ledgerRefusal(id).reason)}. The package reflects the last adopted version.</div>`:""}
     ${t.over_limit?'<div class="banner warn" style="margin:0 0 10px">The package went over its size limit, so some content was trimmed.</div>':""}
     ${handoffCounts("Left out",p.omitted,[["matters_exposure","Matters above this exposure"],["rounds_exposure","rounds above this exposure"],
        ["matters_unavailable","Matters unavailable"],["rounds_without_user_text","rounds without user text"]])}
     ${handoffCounts("Trimmed",t,[["rounds","rounds"],["matters","Matters"],["round_entries","round entries"]])}
     ${handoffCounts("Replaced (count only, the values are not shown)",p.rewrites,[["project","project paths"],["home","home paths"],["path","other paths"],["credential","credentials"]])}
     ${(p.matters||[]).length?"":'<div class="kv dim2">No anchored Matter</div>'}
     ${(p.recent_rounds||[]).length?"":'<div class="kv dim2">No recent rounds</div>'}
     <div class="sect">Package</div><pre id="hmarkdown" style="white-space:pre-wrap">${esc(d.markdown||"")}</pre>`,
    `<button class="btn" onclick="handoffCopy()">Copy Markdown</button>
     <button class="btn" onclick="handoffDownload('md')">Download .md</button>
     <button class="btn" onclick="handoffDownload('json')">Download .json</button>
     <button class="btn" onclick="ledgerDetail('${esc(id)}')">Back to ledger</button>`));
}
async function handoffCopy(){
  if(!handoffCur)return;
  try{await navigator.clipboard.writeText(handoffCur.data.markdown||"");toastMsg("Copied");}
  catch(e){toastMsg("Copy failed; select the text and copy it yourself","err");}
}
function handoffDownload(fmt){
  if(!handoffCur)return;
  const json=fmt==="json",text=json?JSON.stringify(handoffCur.data.package,null,2)+"\n":(handoffCur.data.markdown||"");
  const url=URL.createObjectURL(new Blob([text],{type:json?"application/json":"text/markdown"}));
  const a=document.createElement("a");
  a.href=url;a.download=`handoff-${handoffCur.id}.${json?"json":"md"}`;a.click();
  URL.revokeObjectURL(url);
}
/* 新建：不激活（激活键是 agent + project，这里没有 agent）。失败时带着稿子重开对话框，不丢输入。 */
const ledgerLines=x=>String(x||"").split(/\r?\n/).map(t=>t.trim()).filter(Boolean);
async function ledgerCreate(btn){
  if(ledgerWriting){toastMsg("Another ledger change is still being saved","warn");return;}
  let draft={};
  for(;;){
    const v=await ask({title:"New ledger",ok:"Create",body:`Set the Goal first, then let an agent work. ${esc(MSG_NOT_ACTIVE)}`,
      fields:[{name:"goal",label:"Goal (what done looks like)",type:"textarea",value:draft.goal||""},
              {name:"title",label:"Title (default: first line of the Goal)",value:draft.title||""},
              ...["core","verified","open","next"].map(k=>({name:k,label:`${k} (one entry per line)`,type:"textarea",value:draft[k]||""}))]});
    if(!v)return;
    draft=v;
    const goal=String(v.goal||"").trim();
    if(!goal){toastMsg("Goal cannot be empty","err");continue;}
    try{
      const r=await ledgerWrite(btn,"Creating…","/admin/ledgers/create",
        {goal,title:String(v.title||"").trim(),core:ledgerLines(v.core),verified:ledgerLines(v.verified),
         open:ledgerLines(v.open),next:ledgerLines(v.next),origin:"dashboard"},
        r=>`Created ${r.ledger_id}. ${MSG_NOT_ACTIVE}`);
      if(!r)return;
      await ledgerDetail(r.ledger_id);if(tab==="ledgers")viewLedgers();
      return;
    }catch(e){toastMsg(e.message,"err");}
  }
}
/* 导入：先 dry-run 给用户看 Goal，确认后才真跑。服务端没确认 dry-run ⇒ 停下，不往下走（同 CLI 闸 A）。 */
async function ledgerImport(btn){
  if(ledgerWriting){toastMsg("Another ledger change is still being saved","warn");return;}
  const IMPORT_PATH="/admin/ledgers/import";
  let text="",pkg,r;
  for(;;){
    const v=await ask({title:"Import handoff",ok:"Check package",
      body:"Paste the JSON form (<span class=\"mono\">bladex ledger handoff &lt;id&gt; --format json</span>, or Download .json here). Nothing is written until you confirm on the next step.",
      fields:[{name:"package",label:"Package JSON",type:"textarea",value:text}]});
    if(!v)return;
    text=String(v.package||"");
    try{pkg=JSON.parse(text);}
    catch(e){toastMsg("This is not JSON; nothing was imported","err");continue;}
    try{r=await busy(btn,"Checking…",()=>api("POST",IMPORT_PATH,{package:pkg,dry_run:true}));break;}
    catch(e){toastMsg(e.message,"err");}
  }
  if(!r)return;
  if(r.status!=="dry_run"||r.dry_run!==true){
    toastMsg("The proxy did not confirm a dry run; stopping here. Restart the proxy if it is out of date.","err");return;}
  const ok=await ask({title:"Import this ledger?",ok:"Import",fields:[],
    body:`Would create ${r.id_conflict?"a new ledger (the original id is already taken here)":`<span class="mono">${esc(r.ledger_id)}</span>`}.
      <br><br><b>Title:</b> ${esc(r.title||"")}<br><b>Goal:</b> ${esc(r.goal||"")}
      <br><b>Entries:</b> <span class="mono">${esc(JSON.stringify(r.entry_counts||{}))}</span>
      <br><br>The Goal becomes yours and is shown to your agents on every turn, so only import packages you trust. ${esc(MSG_NOT_ACTIVE)}`});
  if(!ok)return;
  try{
    const done=await ledgerWrite(btn,"Importing…",IMPORT_PATH,{package:pkg,dry_run:false},
      x=>`Imported as ${x.ledger_id}. ${MSG_NOT_ACTIVE}`);
    if(done){await ledgerDetail(done.ledger_id);if(tab==="ledgers")viewLedgers();}
  }catch(e){toastMsg(e.message,"err");}
}

/* DS-08：这一轮锚在哪本账本、注入了什么账本面、有没有剥离-拼接、调了哪些工具、各段耗时。

/* ═══════════════ Rules & Config（硬规则 + 实际生效配置 + drift）═══════════════ */
/* 批 DS1（DS-12）：硬规则自批 Z1.2（MQ-W18）起热加载——每 BLADEX_HARD_RULES_RELOAD_S 秒
   对账 config/.env 与 Hub 最近一条 hard_rules_set（Obsidian 回流），后写者赢
   （bladex_proxy/hard_rules.py 文首）。周期取进程实际生效值；0 = 关热加载，才需要重启。 */
function hardRulesHowTo(reloadS){
  const n=Number(reloadS);
  if(!(n>0))return `Hot reload is off in this process (<span class="mono">BLADEX_HARD_RULES_RELOAD_S=0</span>): edit <span class="mono">BLADEX_HARD_RULES</span> in config/.env, then restart the proxy.`;
  return `Edit <span class="mono">BLADEX_HARD_RULES</span> in config/.env, or the Hard Rules page in the Obsidian export — either takes effect within ${esc(n)} s, no restart needed. If both change, the later write wins. A change that would leave zero rules is rejected and the current rules are kept (see <span class="mono">hard_rules_reload_rejected</span> in the log).`;
}
async function viewConfig(){
  const m=$("#main");m.innerHTML=skel(4,60);
  let rules,status;
  try{[rules,status]=await Promise.all([api("GET","/admin/hard_rules"),api("GET","/admin/status")]);}
  catch(e){if(e.auth)return authGate();m.innerHTML=errorCard(e.message,"viewConfig()");return;}
  const mc=status.memory_config||{},eff=mc.effective||{},flags=mc.flags||{},drift=mc.drift||[];
  const driftKeys=new Set(drift.map(d=>d.key));
  m.innerHTML=`
    ${driftBanner(status)}
    <div class="card"><h3>MUST / NEVER hard rules (${rules.count}, injected every turn)</h3>
      ${(rules.hard_rules||[]).map(r=>`<div class="kv"><span>${esc(r)}</span></div>`).join("")||emptyState("No hard rules configured")}
      <p class="dim" style="margin-bottom:0">${hardRulesHowTo(eff.BLADEX_HARD_RULES_RELOAD_S)}</p></div>
    <div class="grid">
      <div class="card"><h3>Effective memory configuration</h3>
        <p class="dim" style="margin-top:0">Values the running process is actually using - not what the file says.</p>
        ${Object.entries(eff).map(([k,v])=>`<div class="kv">
          <span class="k mono">${esc(k)}</span>
          <span class="num">${esc(v)} ${driftKeys.has(k)?'<span class="tag err">drift</span>':""}</span></div>`).join("")}</div>
      <div class="card"><h3>Feature flags</h3>
        ${Object.entries(flags).map(([k,v])=>`<div class="kv">
          <span class="k mono">${esc(k)}</span>
          <span>${v?'<span class="tag ok">on</span>':'<span class="tag">off</span>'} ${driftKeys.has(k)?'<span class="tag err">drift</span>':""}</span></div>`).join("")||'<span class="dim2">none</span>'}</div>
    </div>
    ${drift.length?`<div class="card"><h3>Drift detail</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Key</th><th>Declared in .env</th><th>Effective in process</th></tr></thead><tbody>
      ${drift.map(x=>`<tr><td class="mono">${esc(x.key)}</td><td class="num">${esc(x.declared)}</td>
        <td class="num" style="color:var(--err)">${esc(x.effective)}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="dim" style="margin-bottom:0">Restart the proxy after editing config/.env, and check for stale exports in the launching shell.</p></div>`:""}`;
}
